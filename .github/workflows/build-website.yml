name: Website Build

on: 
  workflow_dispatch:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.166.0'
          extended: true

      - name: Install Dart Sass
        run: |
          DART_SASS_VERSION=1.104.1
          curl -sfLO "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          tar -xf "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          echo "${GITHUB_WORKSPACE}/dart-sass" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm install

      - name: Build production website
        run: npm run build

      - name: Compress the website
        run: zip -r artifact.zip public/

      #- name: Deploy to GitHub Pages
       # uses: peaceiris/actions-gh-pages@v3
        #with:
         # github_token: ${{ secrets.GITHUB_TOKEN }}
         # publish_dir: ./public
      - uses: actions/upload-artifact@v7
        with:
          path: artifact.zip
          archive: false
          if-no-files-found: error
